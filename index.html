<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12141a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThaiKaraoke">
  <title>ThaiKaraoke</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="voice-banner" class="banner" hidden>
    <div class="banner-text">
      <strong>No Thai voice found.</strong>
      <span id="voice-banner-detail">Audio needs a Thai (th-TH) text-to-speech voice.
      On iPhone: Settings &gt; Accessibility &gt; Spoken Content &gt; Voices &gt; Thai,
      download a voice, then restart this app. On Android: Settings &gt; System &gt;
      Languages &gt; Text-to-speech, install Thai voice data.</span>
    </div>
    <button id="voice-banner-dismiss" class="btn-ghost" aria-label="Dismiss">✕</button>
  </div>

  <main id="main">
    <section id="screen-home" class="screen"></section>
    <section id="screen-session" class="screen" hidden></section>
    <section id="screen-tonegym" class="screen" hidden></section>
    <section id="screen-lessons" class="screen" hidden></section>
    <section id="screen-browse" class="screen" hidden></section>
    <section id="screen-stats" class="screen" hidden></section>
    <section id="screen-settings" class="screen" hidden></section>
  </main>

  <nav id="tabbar">
    <button data-nav="home" class="tab active" aria-label="Home"><span class="tab-icon">⌂</span><span class="tab-label">Home</span></button>
    <button data-nav="tonegym" class="tab" aria-label="Tone Gym"><span class="tab-icon">♪</span><span class="tab-label">Tones</span></button>
    <button data-nav="browse" class="tab" aria-label="Browse"><span class="tab-icon">☰</span><span class="tab-label">Browse</span></button>
    <button data-nav="stats" class="tab" aria-label="Stats"><span class="tab-icon">▤</span><span class="tab-label">Stats</span></button>
    <button data-nav="settings" class="tab" aria-label="Settings"><span class="tab-icon">⚙</span><span class="tab-label">Settings</span></button>
  </nav>

  <div id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
